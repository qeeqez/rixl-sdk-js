pre-commit:
  piped: true
  commands:
    sdk-pack:
      glob: "packages/sdk/**/*.{ts,yaml}"
      run: cd packages/sdk && bun run pack
      stage_fixed: true
      priority: 1
    format:
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: bun format {staged_files}
      stage_fixed: true
      priority: 2
    lint:
      glob: "packages/sdk/**/*.{js,ts,jsx,tsx}"
      exclude:
        - "**/__tests__/**"
        - "packages/sdk/src/generated/**"
      run: bun lint {staged_files}
      stage_fixed: true
      priority: 3
    test:
      glob: "packages/sdk/**/*.{ts,tsx}"
      run: bun run test --run
      priority: 4
