name: Generate SDK

on:
  repository_dispatch:
    types: [regenerate-sdk]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: "true"
          run-install: "true"
      - run: cd packages/sdk && vp pack
      - run: cd packages/sdk && vp check --fix
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat(sdk): regenerate based on latest OpenAPI spec"
          file_pattern: "packages/sdk/src/**"
