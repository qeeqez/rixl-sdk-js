name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up vite-plus
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: "true"
          run-install: "false"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: cd packages/sdk && bun run pack

      - name: Run tests with coverage
        run: bun run test:coverage --run

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vitest.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release Please
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish SDK to npm
        if: ${{ steps.release.outputs['packages/sdk--release_created'] == 'true' }}
        run: cd packages/sdk && vp pack && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
